      description: Запрос на основе курсора.
    - id: selector
      type: System.Func{System.Byte[],{TValue}}
      description: Преобразование "сырых" байтов значения в TValue.
    typeParameters:
    - id: TValue
      description: Целевой тип значения.
    return:
      type: System.Collections.Generic.IEnumerable{{TValue}}
      description: Последовательность преобразованных значений.
