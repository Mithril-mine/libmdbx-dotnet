  summary: >-
    Проецирует значения записей в заданный тип.

    Позволяет писать запросы вида:

    <code>query.Values(Encoding.UTF8.GetString).Where(x =&gt; x == "Some Value")</code>,

    где <code>x</code> — это уже преобразованное значение.
