  summary: >-
    Гистограмма для проверки целостности базы данных (управляемая версия для использования вне unsafe контекста).

    Осуществляет сопоставление с нативной структурой MDBX_chk_histogram.

    Используует фиксированный буфер для массива диапазонов, что позволяет

    использовать указатели на структуры, содержащие эту гистограмму.
