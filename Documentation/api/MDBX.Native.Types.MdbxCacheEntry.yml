  assemblies:
  - mdbx-dotnet
  namespace: MDBX.Native.Types
  summary: Легкая структура кэш-записи, используемая функциями mdbx_cache_get() и mdbx_cache_get_SingleThreaded().
  remarks: >-
    Подход к кэшированию заключается в сохранении смещения значения данных,

    полученного из базы данных, с экстремально быстрой проверкой его актуальности

    на основе идентификатора транзакции внутри внутренних B-деревьевых структур.

    Кэш-запись может быть размещена в разделяемой памяти и использоваться несколькими процессами.

    Каждая кэш-запись должна быть инициализирована функцией mdbx_cache_init() перед первым использованием.
  example: []
