  summary: >-
    Высокоуровневая отложенная (lazy) абстракция над курсором MDBX.

    Представляет собой <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref>, перебирающий все записи таблицы

    поверх нативного курсора. Каждый вызов <xref href="MDBX.MdbxQuery.GetEnumerator" data-throw-if-not-resolved="false"></xref> открывает новый курсор,

    а перебор выполняется лениво, что делает тип полностью совместимым с LINQ

    (Where, Select, First, ToList и т.д.).
