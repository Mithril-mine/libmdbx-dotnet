    startLine: 48
  assemblies:
  - mdbx-dotnet
  namespace: MDBX.Native.Types
  summary: >-
    Результат корректен, но не может быть закэширован, так как изменения ещё не зафиксированы.

    Кэш-запись не изменена, так как изменения данных ещё не зафиксированы и могут быть отменены.

    Результат корректен до следующего изменения внутри текущей write-транзакции.
