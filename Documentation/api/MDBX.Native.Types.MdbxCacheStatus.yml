  assemblies:
  - mdbx-dotnet
  namespace: MDBX.Native.Types
  summary: >-
    Результат получен в обход кэша, так как транзакция слишком старая.

    Кэш-запись отражает более новую версию данных, недоступную в текущем MVCC-снимке.

    Кэш-запись не изменена.

    Результат корректен до конца транзакции.
  example: []
  syntax:
    content: MDBX_CACHE_BEHIND = -2
    return:
      type: MDBX.Native.Types.MdbxCacheStatus
